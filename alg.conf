# alg configuration - Acer ALG AL15G-53
#
# Read by the alg daemon (alg.service). Edit, then:
#     alg reload

[general]
# The curve `alg fan curve` follows when no profile is named.
# Built-ins: silent, balanced, performance, max. You can also name any
# [curve.<name>] section defined below.
#
# This is only the default. A profile picked with `alg fan curve <name>` or in
# the control panel is remembered on its own, in /var/lib/alg/fan-mode.
profile = balanced

# How often to sample temperatures and update the fans, in seconds.
poll_interval = 2.0

# If any sensor reaches this, alg jumps straight to 100% (no ramp) until
# things drop 8 C below it. TjMax on this CPU is 100 C, so 95 leaves margin
# without firing during ordinary heavy load - all-core work sits in the low
# 90s on this chassis quite normally.
#
# This used to hand control back to the firmware instead. That was wrong:
# the firmware curve is *less* aggressive than these profiles up there, so
# the safety net made the machine hotter rather than cooler.
emergency_temp = 95

# Never command a duty below this percentage. Much under 15% the fans can
# stall entirely, which reads as 0 rpm and cools nothing.
min_duty = 10

# The curve target only drops once it has fallen this many percentage
# points. Stops the fans hunting back and forth across a curve knee.
hysteresis = 3

# How fast the fan speed is allowed to change, in percentage points per
# second. Without these the fans slam to 100% the instant a core spikes and
# drop back just as abruptly - noisy, and hard on the bearings.
#
# Rising is deliberately quicker than falling: a real thermal event should
# still be answered promptly, while easing off can take its time. At these
# defaults a full 0-100% sweep takes 10 s up and about 33 s down.
# Set either to 0 to jump straight to the target.
ramp_up = 10
ramp_down = 3

# How often the duty is nudged along that ramp. Sensors are still only read
# every poll_interval, so a fine step costs no extra sensor traffic.
step_interval = 0.5

# Exponential smoothing on the temperature that feeds the curve, as a time
# constant in seconds. Core temperatures are spiky, and without this a
# momentary blip drags the target up and the fans sawtooth their way back
# down. The emergency check above deliberately reads the raw sensor, so
# smoothing never delays the safety response. 0 disables it.
temp_smoothing = 6

# Discrete GPU temperature:
#   auto - read it only while the dGPU is already awake (recommended;
#          polling it otherwise would wake the card and drain battery)
#   on   - always read it, waking the GPU if needed
#   off  - ignore the GPU entirely
use_gpu_temp = auto


[daemon]
# Who may change settings without sudo: root, plus members of any of these
# groups. Reading status is open to every local user. Membership is looked up
# when a program connects, so adding someone to a group takes effect at once -
# no need to log out.
allow_groups = sudo, wheel, alg


# ---------------------------------------------------------------------------
# Custom curves. Format: points = <temp>:<duty%>, <temp>:<duty%>, ...
# Values are linearly interpolated between points, and clamped outside them.
# Use one with `alg fan curve <name>`, where <name> is the part after "curve.".
# ---------------------------------------------------------------------------

[curve.mine]
points = 45:20, 60:35, 70:50, 78:70, 85:90, 90:100

# Keeps the machine quiet on battery at the cost of running warmer.
[curve.quiet]
points = 55:12, 70:22, 80:45, 88:75, 93:100
